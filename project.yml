name: GPSSearcher
options:
  bundleIdPrefix: com.yuta
  deploymentTarget:
    iOS: "17.0"
targets:
  GPSSearcher:
    type: application
    platform: iOS
    sources: [GPSSearcher]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuta.GPSSearcher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "現在のGPS精度を表示するために位置情報を使用します。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
